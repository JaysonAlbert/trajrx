[project]
name = "doctor"
version = "0.1.0"
description = "IDE agent efficiency attribution pipeline (AgentRx-style)"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
doctor = "doctor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["doctor*"]
